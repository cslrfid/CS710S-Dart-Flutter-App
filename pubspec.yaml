name: cs710sflutterapp
description: Flutter app for CS710S RFID reader operations
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # UI
  material_design_icons_flutter: ^7.0.0

  # Utilities
  intl: ^0.18.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^3.0.0

flutter:
  uses-material-design: true
